{% extends 'library/base.html' %}


{% block content %}


<div class="card">

<div class="card-header">
<h3>Form Pengembalian Buku</h3>
</div>


<div class="card-body">


<form method="POST">

{% csrf_token %}


<div class="mb-3">

<label>
Anggota
</label>

<input 
type="text"
class="form-control"
value="{{ peminjaman.anggota.nama }}"
readonly>

</div>



<div class="mb-3">

<label>
Buku
</label>

<input 
type="text"
class="form-control"
value="{{ peminjaman.buku.judul }}"
readonly>

</div>



<div class="mb-3">

<label>
Tanggal Pengembalian
</label>

{{ form.tanggal_pengembalian }}

</div>



<div class="mb-3">

<label>
Kondisi Buku
</label>

{{ form.kondisi_buku }}

</div>



<div class="mb-3">

<label>
Denda
</label>

{{ form.denda }}

</div>


<button type="submit" class="btn btn-success">
    Simpan Pengembalian
</button>


<a href="{% url 'pengembalian' %}"
class="btn btn-secondary">

Kembali

</a>


</form>


</div>

</div>


{% endblock %}
