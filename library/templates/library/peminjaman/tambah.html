{% extends 'library/base.html' %}

{% block title %}
Tambah Peminjaman
{% endblock %}

{% block content %}

<div class="card shadow-sm">

    <div class="card-header bg-success text-white">

        <h4>
            <i class="bi bi-journal-plus"></i>
            Tambah Peminjaman
        </h4>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Anggota
                    </label>

                    {{ form.anggota }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Buku
                    </label>

                    {{ form.buku }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Tanggal Pinjam
                    </label>

                    {{ form.tanggal_pinjam }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Tanggal Kembali
                    </label>

                    {{ form.tanggal_kembali }}

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Status
                    </label>

                    {{ form.status }}

                </div>

            </div>

            <hr>

            <button class="btn btn-success">

                <i class="bi bi-save"></i>

                Simpan

            </button>

            <a href="{% url 'peminjaman' %}" class="btn btn-secondary">

                Kembali

            </a>

        </form>

    </div>

</div>

{% endblock %}
